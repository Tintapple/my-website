<form>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" placeholder="John">
    </div>
    <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" placeholder="Doe">
    </div>
    <div>
        <label for="userEmail">Email Address:</label>
        <input type="email" name="userEmail" id="userEmail"  placeholder="john.doe@example.com" required>
    </div>

        <button type="submit">Sign me up!</button>

<h2> Checkboxes and other shenanigans</h2>

<div>
    <form action="POST"></form>
    <p>How do you get to school?</p>
    <input type="radio" id="bus" name="transportation" value="bus">
    <label for="bus">Bus</label>
    <input type="radio" id="walk" name="transportation" value="bus">
    <label for="walk">Walking</label>
    <input type="radio" id="car" name="transportation" value="car">
    <label for="car">Car</label>
</div>

<br>

<div>
    <p>What are your favorite hobbies?</p>
    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
    <label for="gaming">Gaming</label>
    <input type="checkbox" id="sports" name="hobbies" value="sports">
    <label for="sports">Sports</label>
    <input type="checkbox" id="music" name="hobbies" value="music">
    <label for="music">Music</label>
    <input type="checkbox" id="coding" name="hobbies" value="coding">
    <label for="coding">Coding</label>
</div>

<br>

<div>
    <label for="message">Additional Comments</label>
    <textarea name="message" value="message" id="message" rows="4" cols="10"> </textarea>
</div>

<br>

<div>
    <label for="grade">Grade level</label>
    <select name="grade" id="grade">
        <option value="9th">9th</option>
        <option value="10th">10th</option>
        <option value="11th">11th</option>
        <option value="12th">12th</option>
    </select>
</div>
